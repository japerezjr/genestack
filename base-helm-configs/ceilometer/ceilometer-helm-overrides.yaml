      unit: percent
      volume: $.payload.metrics[?(@.name='cpu.iowait.percent')].value * 100
      resource_id: $.payload.host + "_" + $.payload.nodename
      timestamp: $.payload.metrics[?(@.name='cpu.iowait.percent')].timestamp
      metadata:
        event_type: $.event_type
        host: $.publisher_id
        source: $.payload.metrics[?(@.name='cpu.iowait.percent')].source
    - name: compute.node.cpu.percent
      event_type: compute.metrics.update
      type: gauge
      unit: percent
      volume: $.payload.metrics[?(@.name='cpu.percent')].value * 100
      resource_id: $.payload.host + "_" + $.payload.nodename
      timestamp: $.payload.metrics[?(@.name='cpu.percent')].timestamp
      metadata:
        event_type: $.event_type
        host: $.publisher_id
        source: $.payload.metrics[?(@.name='cpu.percent')].source
    - name: $.payload.outcome.`sub(/.*/, )` + 'identity.authenticate.' + $.payload.outcome
      type: delta
      unit: user
      volume: 1
      event_type:
      - identity.authenticate
      resource_id: $.payload.initiator.id
      user_id: $.payload.initiator.id
    - name: dns.domain.exists
      event_type: dns.domain.exists
      type: cumulative
      unit: s
      volume:
        fields:
        - $.payload.audit_period_beginning
        - $.payload.audit_period_ending
        plugin: timedelta
      project_id: $.payload.tenant_id
      resource_id: $.payload.id
      user_id: $.ctxt.user
      metadata:
        status: $.payload.status
        pool_id: $.payload.pool_id
        host: $.publisher_id
    - name: trove.instance.exists
      event_type: trove.instance.exists
      type: cumulative
      unit: s
      volume:
        fields:
        - $.payload.audit_period_beginning
        - $.payload.audit_period_ending
        plugin: timedelta
      project_id: $.payload.tenant_id
      resource_id: $.payload.instance_id
      user_id: $.payload.user_id
      metadata:
        nova_instance_id: $.payload.nova_instance_id
        state: $.payload.state
        service_id: $.payload.service_id
        instance_type: $.payload.instance_type
        instance_type_id: $.payload.instance_type_id
    - name: manila.share.size
      event_type:
      - share.create.*
      - share.delete.*
      - share.extend.*
      - share.shrink.*
      type: gauge
      unit: GB
      volume: $.payload.size
      user_id: $.payload.user_id
      project_id: $.payload.project_id
      resource_id: $.payload.share_id
      metadata:
        name: $.payload.name
        host: $.payload.host
        status: $.payload.status
        availability_zone: $.payload.availability_zone
        protocol: $.payload.proto
  polling:
    sources:
    - name: all_pollsters
      interval: 300
      meters:
      - '*'
  pipeline:
    sources:
    - name: meter_source
      meters:
      - '*'
      sinks:
      - meter_sink
    - name: blazar_source
      channels:
      - blazar
      meters:
      - '*'
      events:
      - start_lease
      - end_lease
      - before_end_lease
      - lease.*
      sinks:
      - blazar_sink
    sinks:
    - name: meter_sink
      publishers:
      - gnocchi
    - name: blazar_sink
      publishers:
      - gnocchi
    channels:
    - name: blazar
      sources:
      - blazar_source
  event_pipeline:
    sinks:
    - name: event_sink
      publishers:
      - gnocchi://
    sources:
    - events:
      - '*'
      name: event_source
      sinks:
      - event_sink
dependencies:
  static:
    central:
      jobs:
      - ceilometer-db-sync
      - ceilometer-ks-user
      services:
      - endpoint: internal
        service: identity
      - endpoint: internal
        service: metric
    ipmi:
      jobs:
      - ceilometer-db-sync
      - ceilometer-ks-user
      services:
      - endpoint: internal
        service: identity
      - endpoint: internal
        service: metric
    compute:
      jobs:
      - ceilometer-db-sync
      - ceilometer-ks-user
      services:
      - endpoint: internal
        service: identity
      - endpoint: internal
        service: metric
    db_sync:
      jobs: []
      services: []
    notification:
      jobs:
      - ceilometer-db-sync
      - ceilometer-ks-user
      services:
      - endpoint: internal
        service: identity
      - endpoint: internal
        service: metric
endpoints:
  metering:
    port:
      api:
        default: 5000
        public: 80
        internal: 5000
        service: 5000
  metric:
    port:
      api:
        default: 8041
        public: 80
        internal: 8041
        service: 8041
  oslo_messaging:
    host_fqdn_override:
      default: rabbitmq.openstack.svc.cluster.local
  fluentd:
    namespace: fluentbit
    name: fluentd
    hosts:
      default: fluentd-logging
    host_fqdn_override:
      default: null
    path:
      default: null
    scheme: http
    port:
      service:
        default: 24224
      metrics:
        default: 24220
pod:
  resources:
    enabled: true
    notification:
      requests:
        memory: 256
        cpu: 500
      limits:
        memory: 2Gi
        cpu: 2000m
  replicas:
    central: 1
    notification: 1
  lifecycle:
    upgrades:
      deployments:
        revision_history: 3
        pod_replacement_strategy: RollingUpdate
        rolling_update:
          max_unavailable: 20%
          max_surge: 3
      daemonsets:
        pod_replacement_strategy: RollingUpdate
        compute:
          enabled: true
          min_ready_seconds: 0
          max_unavailable: 20%
    disruption_budget:
      api:
        min_available: 0
    termination_grace_period:
      api:
        timeout: 600
manifests:
  deployment_api: false
  deployment_collector: false
  ingress_api: false
  job_rabbit_init: false
  job_db_init: false
  job_db_init_mongodb: false
  job_ks_endpoints: false
  job_ks_service: false
  secret_mongodb: false
  service_ingress_api: false
