images:
  tags:
    test: null
    ceilometer_db_sync: quay.io/rackspace/rackerlabs-ceilometer:2025.1-ubuntu_jammy
    rabbit_init: null
    ks_user: ghcr.io/rackerlabs/genestack-images/heat:2025.1-latest
    ks_service: ghcr.io/rackerlabs/genestack-images/heat:2025.1-latest
    ceilometer_central: quay.io/rackspace/rackerlabs-ceilometer:2025.1-ubuntu_jammy
    ceilometer_compute: quay.io/rackspace/rackerlabs-ceilometer:2025.1-ubuntu_jammy
    ceilometer_ipmi: quay.io/rackspace/rackerlabs-ceilometer:2025.1-ubuntu_jammy
    ceilometer_notification: quay.io/rackspace/rackerlabs-ceilometer:2025.1-ubuntu_jammy
    dep_check: ghcr.io/rackerlabs/genestack-images/kubernetes-entrypoint:latest
    image_repo_sync: null
  pull_policy: Always
conf:
  ceilometer:
    DEFAULT:
      debug: 'false'
      event_dispatchers:
        type: multistring
        values:
        - gnocchi
      meter_dispatchers:
        type: multistring
        values:
        - gnocchi
    api:
      aodh_url: NotUsed
    database:
      connection: NotUsed
      event_connection: NotUsed
      metering_connection: NotUsed
      connection_debug: 0
      connection_recycle_time: 600
      connection_trace: true
      idle_timeout: 3600
      mysql_sql_mode: {}
      use_db_reconnect: true
      pool_timeout: 60
      max_retries: -1
    notification:
      messaging_urls:
        type: multistring
        values:
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/ceilometer
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/cinder
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/glance
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/nova
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/keystone
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/neutron
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/heat
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/swift
        - rabbit://rabbitmq:password@rabbitmq.openstack.svc.cluster.local:5672/blazar
    oslo_messaging_notifications:
      driver: messagingv2
      topics:
      - notifications
      - profiler
    oslo_concurrency:
      lock_path: /tmp/ceilometer
    oslo_messaging_rabbit:
      amqp_durable_queues: false
      rabbit_ha_queues: false
      rabbit_quorum_queue: true
      rabbit_transient_quorum_queue: false
      use_queue_manager: false
      rabbit_interval_max: 10
      heartbeat_rate: 3
      heartbeat_timeout_threshold: 60
      heartbeat_in_pthread: true
      kombu_reconnect_delay: 0.5
  event_definitions:
